[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqe"
version = "0.1.0"
description = "Agentic quality-engineering service with GUI and CLI execution adapters."
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=1.1.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=1.0",
    "playwright>=1.49",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pytest>=8.0",
    "sse-starlette>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
aqe = "aqe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aqe = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live Playwright or Docker checks",
]
